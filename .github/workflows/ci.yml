# CI for BriefingMaster — X-Plane plugin build & unit tests
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_TYPE: Release
  ZOAL_BRIEFING_BUILD_TESTS: ON

jobs:
  # =========================================================================
  # Unit tests — compiles and runs without X-Plane SDK headers
  # =========================================================================
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (tests only)
        run: >
          cmake -B build-test
          -DZoalBriefing_BUILD_TESTS=ON
          -DZoalBriefing_BUILD_PLUGIN=OFF
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build tests
        run: cmake --build build-test --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Run unit tests
        run: |
          cd build-test
          ctest --output-on-failure \
            -C ${{ env.CMAKE_BUILD_TYPE }} \
            --gtest_filter="-performance*" 2>/dev/null || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: build-test/Testing/**/*

  # =========================================================================
  # Plugin build — requires X-Plane SDK headers.
  # Now uses CMake-based download from X-Plane CDN (no git clone, no auth).
  # Mirrors zoal-atc pattern with multi-platform coverage.
  # =========================================================================
  plugin:
    name: Plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # On Windows, MinGW Makefiles give us a single-config generator that
      # respects -DCMAKE_BUILD_TYPE (unlike MSVC which ignores it).
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure plugin + tests (SDK auto-downloaded via CMake)
        run: >
          cmake -B build-plugin
          -DZoalBriefing_BUILD_TESTS=ON
          -DZoalBriefing_BUILD_PLUGIN=ON
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build plugin + tests
        run: cmake --build build-plugin --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Upload .xpl artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoal_briefing-${{ matrix.os }}.xpl
          path: build-plugin/zoal_briefing.xpl
          if-no-files-found: warn

  # =========================================================================
  # Weekly SDK compatibility check — detects upstream breakages.
  # Uses the ensure-sdk.sh script against fresh clone, then verifies CI
  # still compiles against the latest SDK tree.
  # =========================================================================
  sdk-compat-check:
    name: SDK Compat (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    schedule:
      - cron: '0 6 * * 1'   # Mon 6am UTC

    steps:
      - uses: actions/checkout@v4

      - name: Clone latest X-Plane SDK
        run: |
          git clone --depth 1 \
            https://github.com/X-Plane/xpsdk.git xplane-sdk

      - name: Build against latest SDK (using ensure-sdk.sh for CI)
        run: |
          # Point SDK script at our clone, then configure + build
          ./scripts/ensure-sdk.sh $(pwd)/xplane-sdk

          cmake -B build-ci \
            -DZoalBriefing_BUILD_TESTS=ON \
            -DZoalBriefing_XPLANE_SDK=$(pwd)/xplane-sdk \
            -DCMAKE_BUILD_TYPE=Release

      - name: Run tests against SDK
        run: |
          cd build-ci && ctest --output-on-failure 2>/dev/null || true

      - name: Check SDK upstream diff
        run: |
          cd xplane-sdk
          echo "### Last 5 SDK commits" >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY || true
