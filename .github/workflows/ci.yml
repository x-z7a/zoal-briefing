# CI that always ensures the X-Plane SDK is up to date before building,
# so every PR/build uses the latest compatible SDK version.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build (tests only) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Clone X-Plane SDK as a git repo so ensure-sdk.sh can detect updates.
      - name: Clone X-Plane SDK
        run: |
          mkdir -p ~/git
          git clone --depth 1 https://github.com/LaminarResearch/X-Plane-SDK.git \
            ~/git/xplane-sdk

      # Ensure SDK is up to date (in CI we force-check only; no merge conflicts).
      - name: Check SDK upstream
        run: |
          export CI_FORCE_CHECK_ONLY=1
          ./scripts/ensure-sdk.sh ~/git/xplane-sdk

      - name: Configure CMake (tests)
        run: |
          mkdir build-test
          cd build-test
          cmake .. -DZOAL_BRIEFING_BUILD_TESTS=ON

      - name: Build tests
        run: |
          cd build-test
          make -j$(nproc) || make -j1  # retry on parallel failure

      - name: Run unit tests
        run: |
          cd build-test
          ctest --output-on-failure -E "(performance|benchmark)"

  build-plugin:
    name: Build plugin on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Clone X-Plane SDK as a git repo for upstream checking.
      - name: Clone X-Plane SDK
        run: |
          mkdir -p ~/git
          git clone https://github.com/LaminarResearch/X-Plane-SDK.git \
            ~/git/xplane-sdk

      # Ensure SDK is up to date and pull any updates before building.
      # In CI we auto-pull (no read-prompt), then build.
      - name: Ensure SDK latest & build plugin
        run: |
          ./scripts/ensure-sdk.sh ~/git/xplane-sdk
          
          mkdir build-plugin
          cd build-plugin
          cmake .. \
            -DZOAL_BRIEFING_BUILD_PLUGIN=ON \
            -DATC_XPLANE_SDK=$HOME/git/xplane-sdk

      - name: Build plugin
        run: |
          cd build-plugin
          make -j$(nproc) || make -j1

      # Artifact: the .xpl file (simulated here since we don't have the real SDK headers).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoal_briefing-${{ matrix.os }}
          path: build-plugin/zoal_briefing.xpl

