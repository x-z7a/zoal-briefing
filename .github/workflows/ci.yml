# CI for zoal-briefing — X-Plane voice briefing plugin.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # =====================================================================
  # build-test: SDK-free C++ core (all platforms, all three)
  # =====================================================================
  build-test:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # `make test` — what the release gate runs. CI must match the
      # production command so Windows is exercised too (multi-config MSVC
      # ignores CMAKE_BUILD_TYPE and needs --config).
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Test
        run: make test

  # =====================================================================
  # plugin-build: .xpl for every platform. Uses MinGW on Windows so the
  # single-config generator respects CMAKE_BUILD_TYPE just like the release.
  # =====================================================================
  plugin-build:
    name: Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The release build uses MinGW on Windows. Building MSVC here would
      # leave the toolchain that actually ships proven only at tag time.
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make mingw -y

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The CMakeLists.txt auto-downloads the SDK from GitHub releases,
      # so no separate download step is needed. This avoids auth failures
      # that occur when git clone requires credentials for private repos.
      - name: Build plugin
        shell: bash
        run: make plugin

      - name: Upload plugin artifact
        if: runner.os != 'Windows'  # Windows uploads handled separately
        uses: actions/upload-artifact@v4
        with:
          name: zoal-briefing-${{ matrix.os }}-plugin
          path: build-plugin/zoal-briefing.xpl

