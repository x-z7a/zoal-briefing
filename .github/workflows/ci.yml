name: CI

# No paths filter: in this repo every change is a plugin change. The push
# trigger is on because this repo is the plugin — there is no larger tree whose
# CI would catch a bad main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # `make` and not raw cmake, because `make test` is what the release Gate
      # runs. This job used to drive cmake directly with the right --config/-C
      # flags while the Makefile had neither, so the Makefile path reached a tag
      # having never run on Windows — where it configured a multi-config
      # generator, built Debug, looked for Release, and reported all tests
      # "Not Run" as a pass. CI must run the command the release runs.
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Test
        shell: bash
        run: make test

  plugin-build:
    name: X-Plane plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # No Go and no Node: packaging archives with `cmake -E tar`, and cmake
      # is already a hard dependency of the plugin build on all three
      # platforms. The panel is C++ now, built with the plugin.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install make mingw -y

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build plugin
        shell: bash
        run: make plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoal-briefing-${{ matrix.os }}
          path: build-plugin/zoal-briefing.xpl
          retention-days: 7
